<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construct support history · verihogg reports</title>
  <link rel="stylesheet" href="sv-tests-reports.css">
  <style>
    .history-content {
      --added-ink: #235b3c;
      --added-paper: #e9f2e9;
      --lost-ink: #8a3430;
      --lost-paper: #f7eae7;
      padding-bottom: 4rem;
      font: 1rem/1.5 system-ui, sans-serif;
      overflow-wrap: anywhere;
    }
    .history-content a { color: var(--blue); text-underline-offset: .18em; }
    .history-content :is(a, summary):focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .latest-results {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 1rem;
      row-gap: .125rem;
    }
    .latest-results h3, .latest-results p { margin: 0; font-size: 1rem; }
    .latest-results p { color: var(--muted); }
    .latest-results a { white-space: nowrap; }
    .timeline {
      --branch-ink: #8791a5;
      --branch-axis: .4375rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .timeline > li {
      --node-y: calc(var(--entry-start) + .65rem);
      --node-size: .625rem;
      --node-ink: var(--branch-ink);
      --node-fill: var(--paper);
      --entry-start: .625rem;
      position: relative;
      padding: var(--entry-start) 0 .875rem clamp(1.5rem, 3vw, 2.25rem);
    }
    .timeline > li::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: calc(var(--branch-axis) - 1px);
      border-inline-start: 2px solid var(--branch-ink);
    }
    .timeline > li:first-child::before { inset-block-start: var(--node-y); }
    .timeline > li:last-child::before { inset-block-end: calc(100% - var(--node-y)); }
    .timeline > li::after {
      content: "";
      position: absolute;
      box-sizing: border-box;
      inset-block-start: calc(var(--node-y) - var(--node-size) / 2);
      inset-inline-start: calc(var(--branch-axis) - var(--node-size) / 2);
      width: var(--node-size);
      height: var(--node-size);
      border: 2px solid var(--node-ink);
      border-radius: 50%;
      background: var(--node-fill);
    }
    .timeline > .history-latest {
      --entry-start: 0rem;
      --node-size: .875rem;
      --node-ink: var(--blue);
      --node-fill: var(--blue);
      padding-bottom: 1.125rem;
    }
    .timeline > .history-entry { padding-bottom: 1.125rem; }
    .history-entry:has(.support-change) {
      --node-size: .875rem;
      --node-ink: var(--blue);
    }
    .timeline > .no-changes::before { border-inline-start-style: dashed; }
    .timeline > .unchanged {
      --entry-start: 1.125rem;
      padding-bottom: 1.375rem;
    }
    .entry-changes { margin-top: .5rem; }
    .support-change {
      --change-ink: var(--added-ink);
      --change-paper: var(--added-paper);
      list-style: none;
      margin: 0;
      width: fit-content;
      min-width: min(100%, 16rem);
      max-width: 100%;
      padding: .25rem .75rem;
      background: var(--change-paper);
      border-radius: 4px;
      color: var(--change-ink);
    }
    .entry-changes > * + * { margin-top: .5rem; }
    .support-lost {
      --change-ink: var(--lost-ink);
      --change-paper: var(--lost-paper);
    }
    .support-change li {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      padding: .25rem 0;
      font: 600 clamp(.9375rem, .85rem + .35vw, 1.1875rem)/1.45 var(--mono);
    }
    .support-change code { color: var(--ink); font: inherit; }
    .baseline { margin: 0; color: var(--muted); font-size: .875rem; }
    .commit-meta { font-size: .875rem; }
    .commit-meta h3 { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.35; }
    .commit-meta p, .no-changes p { margin: .25rem 0 0; }
    .timeline time, .commit-meta code, .no-changes code {
      color: var(--muted);
      font: .8125rem var(--mono);
      white-space: nowrap;
    }
    .timeline time { margin-inline-end: .5rem; }
    .timeline :is(.commit-meta, .no-changes) a { color: inherit; }
    .commit-meta p { color: var(--muted); }
    .timeline a:hover, summary:hover { color: var(--blue); }
    .history-empty { color: var(--muted); }
    .diagnostic-change, .no-changes { color: var(--muted); font-size: .875rem; }
    summary { width: fit-content; cursor: pointer; }
    details ul { margin: .5rem 0 0; padding-inline-start: 1.25rem; }
    details li + li { margin-top: .25rem; }
  </style>
</head>
<body>
  <header class="report-header">
    <p class="report-brand"><a href="index.html">verihogg <span>/ reports</span></a></p>
    <h2>Construct support history</h2>
  </header>
  <main class="history-content">
    <!-- SUPPORT_HISTORY -->
  </main>
</body>
</html>
