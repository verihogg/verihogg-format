name: Wrong formatting
description: The formatter changed something it should have left alone, or formatted a part incorrectly.
title: "Wrong formatting: "
labels: ["wrong-formatting"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The environment field below may be
        pre-filled from your run — please review it and edit where needed.

        1. **Search the existing issues** for a similar report first.
        2. Keep the example **small**: a few lines of input, the produced
           output and what you expected instead.
        3. Do **not** paste confidential or proprietary code.
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The source before formatting.
      placeholder: |
        // input code
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: What verihogg-format produced.
      placeholder: |
        // formatted output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What you expected instead.
      placeholder: |
        // expected output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Formatter version, OS and config (if any).
      placeholder: |
        verihogg-format 0.1.0
        OS: Linux
    validations:
      required: false
  - type: checkboxes
    id: search
    attributes:
      label: Duplicate check
      options:
        - label: I have searched existing issues and did not find a duplicate of this report.
          required: true
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: I have removed any confidential or proprietary code from this report.
          required: true
